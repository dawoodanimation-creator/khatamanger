<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#086b57"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="Khata Manager"/>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg"/>
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png"/>
    <link rel="manifest" href="%BASE_URL%manifest.json"/>
    <title>Khata Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%BASE_URL%sw.js').then((reg) => {
            reg.addEventListener('updatefound', () => {
              const installing = reg.installing;
              if (!installing) return;
              installing.addEventListener('statechange', () => {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new CustomEvent('khata-sw-update'));
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
